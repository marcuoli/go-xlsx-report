name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.27.3'
          cache: false
      - name: Validate Unix platforms
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/validate.sh --race --scan
      - name: Validate Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/validate.ps1 -Scan
